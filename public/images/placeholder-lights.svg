<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <!-- Background -->
  <rect width="400" height="240" fill="#1e293b"/>

  <!-- String of lights wire -->
  <path d="M0 60 Q100 80 200 60 Q300 40 400 60" stroke="#475569" stroke-width="3" fill="none"/>

  <!-- Light bulbs -->
  <circle cx="50" cy="72" r="12" fill="#ef4444"/>
  <circle cx="100" cy="68" r="12" fill="#22c55e"/>
  <circle cx="150" cy="64" r="12" fill="#f59e0b"/>
  <circle cx="200" cy="62" r="12" fill="#3b82f6"/>
  <circle cx="250" cy="64" r="12" fill="#ef4444"/>
  <circle cx="300" cy="68" r="12" fill="#22c55e"/>
  <circle cx="350" cy="72" r="12" fill="#f59e0b"/>

  <!-- Glow effects -->
  <circle cx="50" cy="72" r="18" fill="#ef4444" opacity="0.3"/>
  <circle cx="100" cy="68" r="18" fill="#22c55e" opacity="0.3"/>
  <circle cx="150" cy="64" r="18" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="62" r="18" fill="#3b82f6" opacity="0.3"/>
  <circle cx="250" cy="64" r="18" fill="#ef4444" opacity="0.3"/>
  <circle cx="300" cy="68" r="18" fill="#22c55e" opacity="0.3"/>
  <circle cx="350" cy="72" r="18" fill="#f59e0b" opacity="0.3"/>

  <!-- House silhouette -->
  <path d="M100 240 L100 160 L200 100 L300 160 L300 240 Z" fill="#334155"/>
  <rect x="170" y="180" width="60" height="60" fill="#475569"/>
  <rect x="120" y="170" width="30" height="30" fill="#fbbf24" opacity="0.8"/>
  <rect x="250" y="170" width="30" height="30" fill="#fbbf24" opacity="0.8"/>

  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="14">No photo yet</text>
</svg>
